<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>recoJY - Gestion des étudiants</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1s ease-in-out;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1;
        }
        
        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .card {
            background: #0f111a;
            border: 1px solid #1e2a3a;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1e2a3a;
        }
        
        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .back-link {
            color: #8ca3ba;
            text-decoration: none;
            padding: 10px 20px;
            background: #080a10;
            border: 1px solid #1e2a3a;
            border-radius: 12px;
            transition: all 0.2s;
        }
        
        .back-link:hover {
            color: #00d4ff;
            border-color: #00d4ff;
        }
        
        .filters-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        
        .filter-group label {
            color: #8ca3ba;
            font-size: 0.7rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }
        
        .filter-group select, .filter-group input {
            width: 100%;
            background: #080a10;
            border: 1px solid #1e2a3a;
            border-radius: 10px;
            padding: 10px 14px;
            color: white;
        }
        
        .search-box {
            background: #080a10;
            border: 1px solid #1e2a3a;
            border-radius: 12px;
            padding: 12px 20px;
            width: 100%;
            color: white;
        }
        
        .actions-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0088aa);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-danger {
            background: #ef4444;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        
        .btn-warning {
            background: #f59e0b;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        
        .students-table {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #1e2a3a;
        }
        
        th {
            background: #080a10;
            color: #00d4ff;
            font-weight: 600;
        }
        
        td {
            color: #e2e8f0;
        }
        
        .photo-preview {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #080a10;
            border: 1px solid #1e2a3a;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #00d4ff;
        }
        
        .stat-label {
            color: #8ca3ba;
            margin-top: 5px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: #0f111a;
            border: 1px solid #1e2a3a;
            border-radius: 24px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
        }
        
        .photos-grid-modal {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .photos-grid-modal img {
            width: 100%;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-users-cog"></i> Gestion des étudiants</h1>
            <a href="{{ url_for('student.accueil') }}" class="back-link">
                <i class="fas fa-arrow-left"></i> Retour au Dashboard
            </a>
        </div>

        <!-- Statistiques -->
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-number" id="totalStudents">-</div>
                <div class="stat-label">Total étudiants</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalPhotos">-</div>
                <div class="stat-label">Photos biométriques</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalPresences">-</div>
                <div class="stat-label">Présences enregistrées</div>
            </div>
        </div>

        <!-- Barre de filtres -->
        <div class="filters-bar">
            <div class="filter-group">
                <label><i class="fas fa-search"></i> Recherche</label>
                <input type="text" id="searchInput" class="search-box" placeholder="Nom, prénom, CNE ou email..." onkeyup="filterStudents()">
            </div>
            <div class="filter-group">
                <label><i class="fas fa-building"></i> Département / Filière</label>
                <select id="deptFilter" onchange="filterStudents()">
                    <option value="">Tous les départements</option>
                </select>
            </div>
        </div>

        <div class="actions-bar">
            <button class="btn-primary" onclick="window.location.href='{{ url_for('student.detail_etudiant') }}'">
                <i class="fas fa-user-plus"></i> Nouvel étudiant
            </button>
            <button class="btn-primary" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> Rafraîchir
            </button>
            <button class="btn-primary" onclick="exportToCSV()">
                <i class="fas fa-file-excel"></i> Exporter CSV
            </button>
        </div>

        <div class="students-table">
            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>CNE Massar</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Département</th>
                        <th>Filière</th>
                        <th>Photos</th>
                        <th>Présences</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr><td colspan="8" style="text-align:center">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal pour voir les photos -->
<div id="photosModal" class="modal">
    <div class="modal-content">
        <div class="header" style="margin-bottom:20px">
            <h3 id="modalStudentName">Photos de l'étudiant</h3>
            <button class="close-btn" onclick="closePhotosModal()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>
        <div id="modalPhotosGrid" class="photos-grid-modal"></div>
    </div>
</div>

<script>
    // Images de fond dynamiques
    const backgrounds = [
        "url('/static/images/bg_abstract.jpg')",
        "url('/static/images/bg_minimal.jpg')",
        "url('/static/images/background.jpg')"
    ];
    
    let currentBg = 0;
    
    function changeBackground() {
        currentBg = (currentBg + 1) % backgrounds.length;
        document.body.style.backgroundImage = backgrounds[currentBg];
    }
    
    setInterval(changeBackground, 5000);
    document.body.style.backgroundImage = backgrounds[0];

    let allStudents = [];
    let allDepartements = [];

    // Charger les départements
    async function loadDepartements() {
        const res = await fetch('/api/departements');
        allDepartements = await res.json();
        const deptSelect = document.getElementById('deptFilter');
        deptSelect.innerHTML = '<option value="">Tous les départements</option>' + 
            allDepartements.map(d => `<option value="${d.NOM_DEPARTEMENT}">${d.NOM_DEPARTEMENT}</option>`).join('');
    }

    // Charger les étudiants
    async function loadStudents() {
        const res = await fetch('/api/etudiants/liste');
        allStudents = await res.json();
        displayStudents(allStudents);
        
        // Mettre à jour les stats
        document.getElementById('totalStudents').innerText = allStudents.length;
        const totalPhotos = allStudents.reduce((sum, s) => sum + (s.photos_count || 0), 0);
        document.getElementById('totalPhotos').innerText = totalPhotos;
    }

    // Charger le nombre de présences
    async function loadPresencesCount() {
        const res = await fetch('/api/presences/count');
        const data = await res.json();
        document.getElementById('totalPresences').innerText = data.count || 0;
    }

    // Filtrer les étudiants
    function filterStudents() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const deptFilter = document.getElementById('deptFilter').value;
        
        const filtered = allStudents.filter(s => {
            const matchSearch = !searchTerm || 
                (s.CNE_MASSAR && s.CNE_MASSAR.toLowerCase().includes(searchTerm)) ||
                (s.NOM && s.NOM.toLowerCase().includes(searchTerm)) ||
                (s.PRENOM && s.PRENOM.toLowerCase().includes(searchTerm)) ||
                (s.MAIL && s.MAIL.toLowerCase().includes(searchTerm));
            
            const matchDept = !deptFilter || s.NOM_DEPARTEMENT === deptFilter;
            
            return matchSearch && matchDept;
        });
        
        displayStudents(filtered);
    }

    // Afficher les étudiants
    function displayStudents(students) {
        const tbody = document.getElementById('studentsTableBody');
        if (students.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center">Aucun étudiant trouvé</td></tr>';
            return;
        }
        
        tbody.innerHTML = students.map(s => `
            <tr>
                <td>${s.CNE_MASSAR || '-'}</td>
                <td>${s.NOM || '-'}</td>
                <td>${s.PRENOM || '-'}</td>
                <td>${s.NOM_DEPARTEMENT || '-'}</td>
                <td>${s.OPTIONS || '-'}</td>
                <td>
                    <button class="btn-warning" onclick="viewPhotos('${s.CNE_MASSAR}', '${s.NOM} ${s.PRENOM}')">
                        <i class="fas fa-images"></i> ${s.photos_count || 0} photo(s)
                    </button>
                </td>
                <td>${s.presences_count || 0}</td>
                <td class="action-buttons">
                    <button class="btn-warning" onclick="editStudent('${s.CNE_MASSAR}')">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn-danger" onclick="deleteStudent('${s.CNE_MASSAR}', '${s.NOM} ${s.PRENOM}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    // Voir les photos d'un étudiant
    async function viewPhotos(cne, name) {
        const res = await fetch(`/api/etudiant/photos/${cne}`);
        const photos = await res.json();
        
        document.getElementById('modalStudentName').innerHTML = `Photos de ${name}`;
        const grid = document.getElementById('modalPhotosGrid');
        
        if (photos.length === 0) {
            grid.innerHTML = '<p style="color:#8ca3ba">Aucune photo disponible</p>';
        } else {
            grid.innerHTML = photos.map(photo => `
                <img src="data:image/jpeg;base64,${photo}" style="width:100%; border-radius:12px;">
            `).join('');
        }
        
        document.getElementById('photosModal').style.display = 'flex';
    }

    function closePhotosModal() {
        document.getElementById('photosModal').style.display = 'none';
    }

    function editStudent(cne) {
        window.location.href = `/modifier_etudiant/${cne}`;
    }

    async function deleteStudent(cne, name) {
        Swal.fire({
            title: 'Confirmation',
            html: `Voulez-vous vraiment supprimer <strong>${name}</strong> ?<br>Toutes ses photos et ses présences seront également supprimées.`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#1e2a3a',
            confirmButtonText: 'Oui, supprimer',
            cancelButtonText: 'Annuler',
            background: '#0f111a',
            color: '#e2e8f0'
        }).then(async (result) => {
            if (result.isConfirmed) {
                const res = await fetch(`/api/etudiant/supprimer/${cne}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    Swal.fire('Supprimé', 'L\'étudiant a été supprimé avec succès.', 'success');
                    loadStudents();
                    loadPresencesCount();
                } else {
                    Swal.fire('Erreur', data.error || 'Une erreur est survenue', 'error');
                }
            }
        });
    }

    function refreshData() {
        loadStudents();
        loadPresencesCount();
    }

    function exportToCSV() {
        window.open('/api/export/etudiants/csv', '_blank');
    }

    // Initialisation
    loadDepartements();
    loadStudents();
    loadPresencesCount();
</script>
</body>
</html>
