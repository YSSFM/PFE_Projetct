<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>recoJY - Modifier étudiant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1s ease-in-out;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1;
        }
        
        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .card {
            background: #0f111a;
            border: 1px solid #1e2a3a;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1e2a3a;
        }
        
        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .back-link {
            color: #8ca3ba;
            text-decoration: none;
            padding: 10px 20px;
            background: #080a10;
            border: 1px solid #1e2a3a;
            border-radius: 12px;
            transition: all 0.2s;
        }
        
        .back-link:hover {
            color: #00d4ff;
            border-color: #00d4ff;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            color: #8ca3ba;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: block;
            margin-bottom: 8px;
        }
        
        .form-group label i {
            margin-right: 6px;
            color: #00d4ff;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            background: #080a10;
            border: 1px solid #1e2a3a;
            border-radius: 12px;
            padding: 14px 16px;
            color: #f1f5f9;
            font-size: 0.9rem;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
        }
        
        .btn-save {
            background: linear-gradient(135deg, #00d4ff, #0088aa);
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }
        
        .photos-section {
            margin: 20px 0;
            padding: 20px;
            background: #080a10;
            border-radius: 16px;
        }
        
        .photos-section h4 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .photo-card {
            position: relative;
            background: #0f111a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e2a3a;
        }
        
        .photo-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }
        
        .remove-photo {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #00d4ff20, #0088aa20);
            border: 1px dashed #00d4ff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .upload-btn i {
            font-size: 2rem;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .upload-btn p {
            color: #8ca3ba;
            font-size: 0.85rem;
        }
        
        hr {
            border-color: #1e2a3a;
            margin: 20px 0;
        }
        
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <h1><i class="fas fa-edit"></i> Modifier l'étudiant</h1>
            <a href="{{ url_for('student.gerer_etudiants') }}" class="back-link">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </div>
        
        <div id="alertMessage" class="alert"></div>

        <form id="editForm" method="POST" action="{{ url_for('student.api_modifier_etudiant') }}" enctype="multipart/form-data">
            <input type="hidden" name="cne_original" id="cne_original">
            
            <div class="form-group">
                <label><i class="fas fa-id-card"></i> CNE Massar</label>
                <input type="text" name="CNEMASSAR" id="CNEMASSAR" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-user"></i> Nom</label>
                <input type="text" name="NOM" id="NOM" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-user"></i> Prénom</label>
                <input type="text" name="PRENOM" id="PRENOM" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-building"></i> Département</label>
                <select name="ID_DEPARTEMENT" id="ID_DEPARTEMENT" required>
                    <option value="">Sélectionnez</option>
                    {% for dept in departements %}
                    <option value="{{ dept.ID_DEPARTEMENT }}">{{ dept.NOM_DEPARTEMENT }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-code-branch"></i> Option / Filière</label>
                <input type="text" name="OPTIONS" id="OPTIONS">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-calendar-alt"></i> Année Académique</label>
                <input type="text" name="ANNEE_ACADEMIQUE" id="ANNEE_ACADEMIQUE">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-layer-group"></i> Semestre</label>
                <input type="text" name="SEMESTRE" id="SEMESTRE">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-venus-mars"></i> Sexe</label>
                <select name="SEX" id="SEX">
                    <option value="M">Masculin</option>
                    <option value="F">Féminin</option>
                </select>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="MAIL" id="MAIL">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-phone-alt"></i> Téléphone</label>
                <input type="text" name="TELEPHONE" id="TELEPHONE">
            </div>

            <div class="photos-section">
                <h4><i class="fas fa-images"></i> Photos actuelles</h4>
                <div id="existingPhotos" class="photos-grid"></div>
            </div>

            <div class="photos-section">
                <h4><i class="fas fa-plus-circle"></i> Ajouter des photos</h4>
                <div class="upload-btn" onclick="document.getElementById('newPhotos').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Cliquez pour sélectionner des photos</p>
                    <p style="font-size:0.7rem">Formats: JPG, PNG, JPEG</p>
                </div>
                <input type="file" id="newPhotos" name="new_photos" accept="image/*" multiple style="display:none;">
                <div id="newPhotosPreview" class="photos-grid"></div>
            </div>

            <hr>

            <button type="submit" class="btn-save">
                <i class="fas fa-save"></i> Enregistrer les modifications
            </button>
        </form>
    </div>
</div>

<script>
    // Images de fond dynamiques
    const backgrounds = [
        "url('/static/images/bg_abstract.jpg')",
        "url('/static/images/bg_minimal.jpg')",
        "url('/static/images/background.jpg')"
    ];
    
    let currentBg = 0;
    
    function changeBackground() {
        currentBg = (currentBg + 1) % backgrounds.length;
        document.body.style.backgroundImage = backgrounds[currentBg];
    }
    
    setInterval(changeBackground, 5000);
    document.body.style.backgroundImage = backgrounds[0];

    // Récupérer le CNE depuis l'URL
    const pathParts = window.location.pathname.split('/');
    const cne = pathParts[pathParts.length - 1];

    async function loadStudent() {
        try {
            const res = await fetch(`/api/etudiant/${cne}`);
            if (!res.ok) {
                throw new Error('Étudiant non trouvé');
            }
            const student = await res.json();
            
            document.getElementById('cne_original').value = student.CNE_MASSAR;
            document.getElementById('CNEMASSAR').value = student.CNE_MASSAR;
            document.getElementById('NOM').value = student.NOM;
            document.getElementById('PRENOM').value = student.PRENOM;
            document.getElementById('ID_DEPARTEMENT').value = student.ID_DEPARTEMENT;
            document.getElementById('OPTIONS').value = student.OPTIONS || '';
            document.getElementById('ANNEE_ACADEMIQUE').value = student.ANNEE_ACADEMIQUE || '';
            document.getElementById('SEMESTRE').value = student.SEMESTRE || '';
            document.getElementById('SEX').value = student.SEX || 'M';
            document.getElementById('MAIL').value = student.MAIL || '';
            document.getElementById('TELEPHONE').value = student.TELEPHONE || '';
            
            // Charger les photos
            const photosRes = await fetch(`/api/etudiant/photos/${cne}`);
            const photos = await photosRes.json();
            const container = document.getElementById('existingPhotos');
            if (photos && photos.length) {
                container.innerHTML = photos.map((photo, idx) => `
                    <div class="photo-card">
                        <img src="data:image/jpeg;base64,${photo}">
                        <button type="button" class="remove-photo" onclick="deletePhoto(${idx})">✕</button>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p style="color:#8ca3ba">Aucune photo disponible</p>';
            }
        } catch (error) {
            showAlert('Erreur: ' + error.message, 'error');
        }
    }

    async function deletePhoto(index) {
        const res = await fetch(`/api/etudiant/supprimer-photo/${cne}/${index}`, { method: 'DELETE' });
        if (res.ok) {
            Swal.fire('Succès', 'Photo supprimée', 'success');
            loadStudent();
        } else {
            Swal.fire('Erreur', 'Impossible de supprimer la photo', 'error');
        }
    }

    document.getElementById('newPhotos').addEventListener('change', function(e) {
        const preview = document.getElementById('newPhotosPreview');
        preview.innerHTML = '';
        Array.from(e.target.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(ev) {
                const div = document.createElement('div');
                div.className = 'photo-card';
                div.innerHTML = `<img src="${ev.target.result}"><button type="button" class="remove-photo" onclick="this.parentElement.remove()">✕</button>`;
                preview.appendChild(div);
            };
            reader.readAsDataURL(file);
        });
    });

    function showAlert(message, type) {
        const alertDiv = document.getElementById('alertMessage');
        alertDiv.className = `alert alert-${type}`;
        alertDiv.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
        alertDiv.style.display = 'block';
        setTimeout(() => { alertDiv.style.display = 'none'; }, 5000);
    }

    document.getElementById('editForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        Swal.fire({
            title: 'Confirmation',
            text: 'Voulez-vous vraiment enregistrer les modifications ?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#00d4ff',
            cancelButtonColor: '#1e2a3a',
            confirmButtonText: 'Oui, enregistrer',
            cancelButtonText: 'Annuler',
            background: '#0f111a',
            color: '#e2e8f0'
        }).then(async (result) => {
            if (result.isConfirmed) {
                const formData = new FormData(document.getElementById('editForm'));
                const res = await fetch('/api/etudiant/modifier', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    Swal.fire('Succès', 'Étudiant modifié avec succès', 'success').then(() => {
                        window.location.href = "/gerer_etudiants";
                    });
                } else {
                    Swal.fire('Erreur', data.error || 'Une erreur est survenue', 'error');
                }
            }
        });
    });

    loadStudent();
</script>
</body>
</html>
